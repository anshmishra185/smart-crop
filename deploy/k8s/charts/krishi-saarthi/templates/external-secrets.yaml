apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-vault-secrets
  labels:
    app.kubernetes.io/name: krishi-saarthi
    app.kubernetes.io/component: backend
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend-store
    kind: ClusterSecretStore
  target:
    name: {{ .Release.Name }}-credentials
    creationPolicy: Owner
  data:
    - secretKey: RAZORPAY_WEBHOOK_SECRET
      remoteRef:
        key: secret/data/krishi-saarthi/fintech
        property: razorpay_webhook_secret
    - secretKey: AES_256_ENVELOPE_MASTER_KEY
      remoteRef:
        key: secret/data/krishi-saarthi/security
        property: aes_master_key
    - secretKey: UIDAI_SIGNING_PRIVATE_KEY
      remoteRef:
        key: secret/data/krishi-saarthi/kyc
        property: uidai_rsa_key

