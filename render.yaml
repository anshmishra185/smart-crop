databases:
  - name: krishi-saarthi-db
    databaseName: krishisaarthi
    user: krishisaarthi_user
    plan: free
    region: oregon

services:
  - type: web
    name: krishi-saarthi-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: krishi-saarthi-db
          property: connectionString
